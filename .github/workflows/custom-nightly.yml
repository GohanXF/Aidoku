name: Build custom Aidoku IPA

on:
  workflow_dispatch:
    inputs:
      prs:
        description: "PR numbers to merge, separated by spaces (example: 1020 1023 1025)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout latest Aidoku main
        uses: actions/checkout@v4
        with:
          repository: Aidoku/Aidoku
          ref: main
          fetch-depth: 0

      - name: Merge selected pull requests
        if: ${{ inputs.prs != '' }}
        env:
          PRS: ${{ inputs.prs }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for PR in $PRS; do
            echo "Fetching PR #$PR"
            git fetch origin pull/$PR/head:pr-$PR

            echo "Merging PR #$PR"
            git merge --no-edit pr-$PR
          done

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Install Xcode platforms
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Get commit SHA
        id: commitinfo
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild \
            -scheme "Aidoku (iOS)" \
            -configuration Release \
            archive \
            -archivePath build/Aidoku.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Aidoku.xcarchive/Products/Applications/Aidoku.app Payload
          zip -r Aidoku-iOS_custom-${{ steps.commitinfo.outputs.sha_short }}.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-iOS_custom-${{ steps.commitinfo.outputs.sha_short }}
          path: Aidoku-iOS_custom-${{ steps.commitinfo.outputs.sha_short }}.ipa
          if-no-files-found: error
